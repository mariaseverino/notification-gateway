version: "3.8"

services:
  app:
    build: .
    container_name: notification-gateway-app
    restart: unless-stopped
    command: npm run dev
    ports:
      - "3333:3333"
    volumes:
      - .:/usr/src/app
      - /usr/src/app/node_modules # Impede que o node_modules local sobrescreva o do container
    environment:
      - NODE_ENV=development
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=notification-gateway
      - DB_PASS=notification-gateway
      - DB_NAME=notification-gateway
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - RABBITMQ_URL=amqp://notification-gateway:notification-gateway@rabbitmq:5672
      - MAILHOG_HOST=mailhog
      - MAILHOG_PORT=1025
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    container_name: notification-gateway-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: notification-gateway
      POSTGRES_USER: notification-gateway
      POSTGRES_PASSWORD: notification-gateway
    ports:
      - "5432:5432"
    volumes:
      - notification-gateway_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U notification-gateway -d notification-gateway"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: notification-gateway-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: notification-gateway-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: notification-gateway
      RABBITMQ_DEFAULT_PASS: notification-gateway
    ports:
      - "5672:5672"   # protocolo AMQP
      - "15672:15672" # painel web do RabbitMQ
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  mailhog:
    image: mailhog/mailhog:latest
    container_name: notification-gateway-mailhog
    restart: unless-stopped
    ports:
      - "1025:1025" # SMTP
      - "8025:8025" # Painel web do MailHog

volumes:
  notification-gateway_postgres_data: